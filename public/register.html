<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja - Neon Detailing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">NEON<span>DETAIL</span></a>

        <div class="hamburger">
            <span class="line"></span><span class="line"></span><span class="line"></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Strona główna</a></li>
            <li><a href="offer.html">Oferta</a></li>
            <li><a href="about.html">O nas</a></li>
            <li><a href="contact.html">Kontakt</a></li>
        </ul>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-box">
        <h2>Załóż konto</h2>

        <form id="registerForm">
            <div class="form-group">
                <label>Imię i Nazwisko</label>
                <input type="text" id="name" required placeholder="Jan Kowalski">
            </div>

            <div class="form-group">
                <label>Numer Telefonu</label>
                <div class="phone-group">
                    <select id="phonePrefix" class="prefix-select">
                        <option value="+48" selected>🇵🇱 +48</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+380">🇺🇦 +380</option>
                    </select>

                    <input type="tel" id="phoneNumber" required placeholder="123 456 789" pattern="[0-9\s]{9,15}">
                </div>
            </div>

            <div class="form-group">
                <label>Adres Email</label>
                <input type="email" id="email" required placeholder="jan@example.com">
            </div>

            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" required placeholder="Minimum 6 znaków">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Zarejestruj się</button>
        </form>

        <div class="auth-footer">
            Masz już konto? <a href="login.html">Zaloguj się tutaj</a>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const prefix = document.getElementById('phonePrefix').value;
        const number = document.getElementById('phoneNumber').value;
        const fullPhone = `${prefix} ${number}`;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, phone: fullPhone }),
            });

            const data = await response.json();

            if (response.ok) {
                await showPopup('Sukces! Konto założone.\nMożesz się zalogować.', 'success');
                window.location.href = 'login.html';
            } else {
                await showPopup('Błąd: ' + data.message, 'error');
            }
        } catch (error) {
            await showPopup('Wystąpił błąd połączenia z serwerem.', 'error');
        }
    });
</script>
</body>
</html>
