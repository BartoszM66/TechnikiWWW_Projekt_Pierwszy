<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Neon Detailing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">NEON<span>DETAIL</span></a>

        <div class="hamburger">
            <span class="line"></span><span class="line"></span><span class="line"></span>
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Strona główna</a></li>
            <li><a href="offer.html">Oferta</a></li>
            <li><a href="about.html">O nas</a></li>
            <li><a href="contact.html">Kontakt</a></li>
        </ul>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-box">
        <h2>Zaloguj się</h2>

        <form id="loginForm">
            <div class="form-group">
                <label>Adres Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Zaloguj się</button>
        </form>

        <div class="auth-footer">
            Nie masz konta? <a href="register.html">Zarejestruj się</a>
        </div>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    const existingUser = JSON.parse(localStorage.getItem('user'));
    if (existingUser) {
        if (existingUser.role === 'admin') window.location.href = 'admin_panel.html';
        else window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('user', JSON.stringify(data.user));

                await showPopup('Witaj ' + data.user.name + '!', 'success');

                if (data.user.role === 'admin') {
                    window.location.href = 'admin_panel.html';
                } else {
                    window.location.href = 'index.html';
                }

            } else {
                await showPopup('Błąd: ' + data.message, 'error');
            }
        } catch (error) {
            await showPopup('Błąd połączenia z serwerem.', 'error');
        }
    });
</script>
</body>
</html>
